{% extends 'base.html' %}

{% block title %}Entrar - ProgressoFit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Entrar na sua conta</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Digite seu usuário" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Entrar</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <small class="text-secondary">Ainda não tem conta? <a href="{% url 'contas:cadastro' %}" class="text-success">Cadastre-se</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
