{% extends 'base.html' %}

{% block title %}Solicitar Verificação - ProgressoFit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <h2 class="mb-2">Verificação de Especialista</h2>
            <p class="text-secondary mb-4">Envie suas credenciais profissionais para obter acesso ao painel de validação de treinos e nutrição.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="area_atuacao" class="form-label">Área de Atuação</label>
                    <select id="area_atuacao" name="area_atuacao" class="form-select" required>
                        <option value="" disabled selected>Selecione sua área</option>
                        <option value="Nutricionista">Nutricionista</option>
                        <option value="Educador físico">Educador físico</option>
                        <option value="Médico do esporte">Médico do esporte</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="registro_profissional" class="form-label">Registro Profissional (CREF, CRN, CRM)</label>
                    <input type="text" id="registro_profissional" name="registro_profissional" class="form-control" placeholder="Ex: CREF 123456-G/SP" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Enviar Solicitação</button>
                    <a href="{% url 'contas:perfil' %}" class="btn btn-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
