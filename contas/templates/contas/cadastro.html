{% extends 'base.html' %}

{% block title %}Cadastro - ProgressoFit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="text-center mb-4">Criar nova conta</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="nome_completo" class="form-label">Nome Completo</label>
                    <input type="text" id="nome_completo" name="nome_completo" class="form-control" placeholder="Ex: Alejandro Silva" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de Usuário</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Escolha um nome de usuário" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Crie uma senha forte" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Criar Conta</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <small class="text-secondary">Já possui conta? <a href="{% url 'contas:login' %}" class="text-success">Faça login</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
