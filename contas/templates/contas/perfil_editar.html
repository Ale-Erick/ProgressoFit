{% extends 'base.html' %}

{% block title %}Editar Perfil - ProgressoFit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="mb-4">Editar Perfil</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="nome_completo" class="form-label">Nome Completo</label>
                    <input type="text" id="nome_completo" name="nome_completo" class="form-control" value="Alejandro Silva" required>
                </div>
                <div class="mb-3">
                    <label for="nivel_conhecimento" class="form-label">Nível de Conhecimento</label>
                    <select id="nivel_conhecimento" name="nivel_conhecimento" class="form-select">
                        <option value="Iniciante" selected>Iniciante</option>
                        <option value="Intermediário">Intermediário</option>
                        <option value="Avançado">Avançado</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição / Biografia</label>
                    <textarea id="descricao" name="descricao" class="form-control" rows="3">Focado em manter a constância nos treinos e melhorar o condicionamento físico.</textarea>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="publico" name="publico">
                    <label class="form-check-label" for="publico">Tornar perfil público para outros usuários</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                    <a href="{% url 'contas:perfil' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
