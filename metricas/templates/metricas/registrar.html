{% extends 'base.html' %}
{% block title %}Registrar Métrica - ProgressoFit{% endblock %}
{% block content %}
<h2>Registrar medição</h2>
<form method="post" class="card p-4">
    {% csrf_token %}
    <div class="mb-3">
        <label for="data" class="form-label">Data</label>
        <input type="date" id="data" name="data" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="peso" class="form-label">Peso (kg)</label>
        <input type="number" step="0.01" id="peso" name="peso" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="altura" class="form-label">Altura (m)</label>
        <input type="number" step="0.01" id="altura" name="altura" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="gordura" class="form-label">% de gordura (opcional)</label>
        <input type="number" step="0.1" id="gordura" name="percentual_gordura" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
</form>
{% endblock %}
